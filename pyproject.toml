[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterhub-tmpauthenticator"
license = "BSD-3-Clause"
version = "1.0.0"
dynamic = ["readme"]
description = "JupyterHub authenticator that hands out temporary accounts for everyone"
authors = [
    { name = "Project Jupyter Contributors", email = "jupyter@googlegroups.com" },
]
requires-python = ">=3.10"
dependencies = [
    "jupyterhub>=4",
    "traitlets",
]

[project.urls]
Source = "https://github.com/jupyterhub/tmpauthenticator"

[project.optional-dependencies]
test = [
    "aiohttp",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyterhub",
]

[project.entry-points."jupyterhub.authenticators"]
tmp = "tmpauthenticator:TmpAuthenticator"

[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools.packages.find]
where = [""]
include = ["tmpauthenticator"]


# autoflake is used for autoformatting Python code
#
# ref: https://github.com/PyCQA/autoflake#readme
#
[tool.autoflake]
ignore-init-module-imports = true
remove-all-unused-imports = true
remove-duplicate-keys = true
remove-unused-variables = true


# black is used for autoformatting Python code
#
# ref: https://black.readthedocs.io/en/stable/
#
[tool.black]


# isort is used for autoformatting Python code
#
# ref: https://pycqa.github.io/isort/
#
[tool.isort]
profile = "black"


# pytest is used for running Python based tests
#
# ref: https://docs.pytest.org/en/stable/
#
[tool.pytest.ini_options]
addopts = "--verbose --color=yes --durations=10"
asyncio_mode = "auto"
testpaths = ["tests"]


# tbump is used to simplify and standardize the release process when updating
# the version, making a git commit and tag, and pushing changes.
#
# ref: https://github.com/your-tools/tbump#readme
#
[tool.tbump]
github_url = "https://github.com/jupyterhub/tmpauthenticator"

[tool.tbump.version]
current = "1.0.0"
regex = '''
    (?P<major>\d+)
    \.
    (?P<minor>\d+)
    \.
    (?P<patch>\d+)
    (?P<pre>((a|b|rc)\d+)|)
    \.?
    (?P<dev>(?<=\.)dev\d*|)
'''

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

[[tool.tbump.file]]
src = "pyproject.toml"
